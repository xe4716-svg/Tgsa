name: Gateway command safety
on:
  push:
    branches: ['fix/asd-30-account-broadcast-gateway']
  pull_request:
    paths: ['app/telegram/**', 'migrations/**', 'tests/test_gateway*', '.github/workflows/gateway-commands.yml']
permissions:
  contents: read
jobs:
  controlled-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: isolated-ci-password
      PG_PSQL: psql
      TGMATE_COMMAND_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: python -m pytest tests -q --junitxml=gateway-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-tests
          path: gateway-tests.xml
