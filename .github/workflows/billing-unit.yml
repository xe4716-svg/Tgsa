name: Billing unit checks

on:
  push:
    paths:
      - 'app/billing/**'
      - 'tests/test_billing_entitlements.py'
      - 'tests/test_billing_commerce.py'
      - 'migrations/006_wallet_commerce.sql'
      - '.github/workflows/billing-unit.yml'
  pull_request:
    paths:
      - 'app/billing/**'
      - 'tests/test_billing_entitlements.py'
      - 'tests/test_billing_commerce.py'
      - 'migrations/006_wallet_commerce.sql'
      - 'app/main.py'
      - '.github/workflows/billing-unit.yml'

jobs:
  billing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest 'fastapi>=0.115,<1'
      - name: Compile billing sources
        run: python -m compileall -q app/billing tests/test_billing_entitlements.py tests/test_billing_commerce.py
      - name: Run billing unit tests
        run: python -m pytest -q tests/test_billing_entitlements.py tests/test_billing_commerce.py
