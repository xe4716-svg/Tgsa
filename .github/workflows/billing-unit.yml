name: Billing unit checks

on:
  push:
    paths:
      - 'app/billing/**'
      - 'tests/test_billing_entitlements.py'
      - 'tests/test_billing_commerce.py'
      - 'tests/test_payment_gateway.py'
      - 'tests/test_tron_watcher.py'
      - 'tests/test_billing_automation.py'
      - 'app/billing/automation.py'
      - 'app/billing/tron_watcher.py'
      - 'migrations/006_wallet_commerce.sql'
      - 'migrations/007_payment_orchestration.sql'
      - 'migrations/008_auto_renewal.sql'
      - 'migrations/009_telegram_notifications.sql'
      - 'app/billing/payment_gateway.py'
      - 'app/billing/payments.py'
      - 'app/main.py'
      - 'app/config.py'
      - 'app/auth/mailer.py'
      - '.github/workflows/billing-unit.yml'
  pull_request:
    paths:
      - 'app/billing/**'
      - 'tests/test_billing_entitlements.py'
      - 'tests/test_billing_commerce.py'
      - 'tests/test_payment_gateway.py'
      - 'tests/test_tron_watcher.py'
      - 'tests/test_billing_automation.py'
      - 'app/billing/automation.py'
      - 'app/billing/tron_watcher.py'
      - 'migrations/006_wallet_commerce.sql'
      - 'migrations/007_payment_orchestration.sql'
      - 'migrations/008_auto_renewal.sql'
      - 'migrations/009_telegram_notifications.sql'
      - 'app/billing/payment_gateway.py'
      - 'app/billing/payments.py'
      - 'app/main.py'
      - 'app/auth/mailer.py'
      - '.github/workflows/billing-unit.yml'

jobs:
  billing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest 'fastapi>=0.115,<1' 'cryptography>=44,<47' 'httpx>=0.27,<1' 'bip-utils>=2.9,<3' 'aiosmtplib>=3,<5'
      - name: Compile billing sources
        run: python -m compileall -q app/billing tests/test_billing_entitlements.py tests/test_billing_commerce.py tests/test_payment_gateway.py tests/test_tron_watcher.py tests/test_billing_automation.py
      - name: Run billing unit tests
        run: python -m pytest -q tests/test_billing_entitlements.py tests/test_billing_commerce.py tests/test_payment_gateway.py tests/test_tron_watcher.py tests/test_billing_automation.py
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply all database migrations
        env:
          PGPASSWORD: postgres-test-password
          APP_DB_PASSWORD: runtime-test-password
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE tgs"
          for migration in migrations/*.sql; do
            echo "Applying $migration"
            psql -h localhost -U postgres -d tgs -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -h localhost -U postgres -d tgs -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM membership_plans"
          psql -h localhost -U postgres -d tgs -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM payment_provider_configs"
      - name: Verify wallet RLS and immutable ledger permissions
        env:
          PGPASSWORD: postgres-test-password
          APP_DB_PASSWORD: runtime-test-password
        run: |
          TENANT_A=$(psql -h localhost -U postgres -d tgs -Atqc "INSERT INTO tenants(name) VALUES ('CI tenant A') RETURNING id")
          TENANT_B=$(psql -h localhost -U postgres -d tgs -Atqc "INSERT INTO tenants(name) VALUES ('CI tenant B') RETURNING id")
          psql -h localhost -U postgres -d tgs -v ON_ERROR_STOP=1 -c "INSERT INTO tenant_wallet_accounts(tenant_id, currency, balance_minor) VALUES ('$TENANT_A', 'USD', 100), ('$TENANT_B', 'USD', 200)"
          PGPASSWORD="$APP_DB_PASSWORD" psql -h localhost -U tgs_runtime -d tgs -v ON_ERROR_STOP=1 -c "BEGIN; SELECT set_config('app.tenant_id', '$TENANT_A', true); INSERT INTO wallet_ledger_entries(tenant_id, currency, direction, entry_type, amount_minor, balance_after_minor, idempotency_key, reason) VALUES ('$TENANT_A', 'USD', 'CREDIT', 'ADMIN_CREDIT', 100, 100, 'ci-wallet-ledger-smoke', 'CI smoke test'); COMMIT"
          VISIBLE=$(PGPASSWORD="$APP_DB_PASSWORD" psql -h localhost -U tgs_runtime -d tgs -Atqc "BEGIN; SELECT set_config('app.tenant_id', '$TENANT_A', true); SELECT COUNT(*) FROM tenant_wallet_accounts; COMMIT" | tail -n 1)
          test "$VISIBLE" = "1"
          if PGPASSWORD="$APP_DB_PASSWORD" psql -h localhost -U tgs_runtime -d tgs -v ON_ERROR_STOP=1 -c "BEGIN; SELECT set_config('app.tenant_id', '$TENANT_A', true); INSERT INTO tenant_wallet_accounts(tenant_id, currency, balance_minor) VALUES ('$TENANT_B', 'USD', 999); COMMIT"; then
            echo "Cross-tenant wallet write unexpectedly succeeded"
            exit 1
          fi
          if PGPASSWORD="$APP_DB_PASSWORD" psql -h localhost -U tgs_runtime -d tgs -v ON_ERROR_STOP=1 -c "UPDATE wallet_ledger_entries SET reason = 'tampered' WHERE idempotency_key = 'ci-wallet-ledger-smoke'"; then
            echo "Wallet ledger update unexpectedly succeeded"
            exit 1
          fi
          TOPUP_ORDER_NO="ci-tron-$(echo "$TENANT_A" | cut -c1-8)"
          psql -h localhost -U postgres -d tgs -v ON_ERROR_STOP=1 -c "INSERT INTO wallet_topup_orders(tenant_id, order_no, provider, idempotency_key, request_fingerprint, currency, amount_minor, expires_at, deposit_address, derivation_index) VALUES ('$TENANT_A', '$TOPUP_ORDER_NO', 'USDT', 'ci-tron-topup-idempotency', repeat('a', 64), 'USDT', 10000000, NOW() + INTERVAL '1 day', 'TQCiTestDepositAddress0000000000000', 999999999)"
          RESOLVED=$(PGPASSWORD="$APP_DB_PASSWORD" psql -h localhost -U tgs_runtime -d tgs -Atqc "SELECT tenant_id::text || '|' || amount_minor::text FROM resolve_wallet_topup_order('$TOPUP_ORDER_NO')")
          test "$RESOLVED" = "$TENANT_A|10000000"
          CLAIMED=$(PGPASSWORD="$APP_DB_PASSWORD" psql -h localhost -U tgs_runtime -d tgs -Atqc "SELECT order_no FROM claim_pending_tron_deposits(10)")
          test "$CLAIMED" = "$TOPUP_ORDER_NO"
          TOPUP_VISIBLE=$(PGPASSWORD="$APP_DB_PASSWORD" psql -h localhost -U tgs_runtime -d tgs -Atqc "BEGIN; SELECT set_config('app.tenant_id', '$TENANT_A', true); SELECT COUNT(*) FROM wallet_topup_orders; COMMIT" | tail -n 1)
          test "$TOPUP_VISIBLE" = "1"
          RESOLVED_DEPOSIT=$(PGPASSWORD="$APP_DB_PASSWORD" psql -h localhost -U tgs_runtime -d tgs -Atqc "SELECT deposit_address || '|' || derivation_index::text FROM resolve_tron_deposit_order('$TOPUP_ORDER_NO')")
          test "$RESOLVED_DEPOSIT" = "TQCiTestDepositAddress0000000000000|999999999"
          SWEEP_ID=$(psql -h localhost -U postgres -d tgs -Atqc "INSERT INTO tron_sweep_jobs(tenant_id, topup_order_id, source_address, derivation_index, destination_address, token_contract, amount_minor, max_fee_sun, reason) SELECT '$TENANT_A', id, deposit_address, derivation_index, 'TQCiTreasuryAddress000000000000000', 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t', amount_minor, 1000000, 'CI sweep queue test' FROM wallet_topup_orders WHERE order_no = '$TOPUP_ORDER_NO' RETURNING id")
          CLAIMED_SWEEP=$(PGPASSWORD="$APP_DB_PASSWORD" psql -h localhost -U tgs_runtime -d tgs -Atqc "SELECT id FROM claim_pending_tron_sweeps(10)")
          test "$CLAIMED_SWEEP" = "$SWEEP_ID"
          SWEEP_COUNT=$(PGPASSWORD="$APP_DB_PASSWORD" psql -h localhost -U tgs_runtime -d tgs -Atqc "SELECT COUNT(*) FROM list_tron_sweep_jobs(NULL, 100)")
          test "$SWEEP_COUNT" = "1"
          SWEEP_VISIBLE=$(PGPASSWORD="$APP_DB_PASSWORD" psql -h localhost -U tgs_runtime -d tgs -Atqc "BEGIN; SELECT set_config('app.tenant_id', '$TENANT_A', true); SELECT COUNT(*) FROM tron_sweep_jobs; COMMIT" | tail -n 1)
          test "$SWEEP_VISIBLE" = "1"
          if PGPASSWORD="$APP_DB_PASSWORD" psql -h localhost -U tgs_runtime -d tgs -v ON_ERROR_STOP=1 -c "BEGIN; SELECT set_config('app.tenant_id', '$TENANT_A', true); INSERT INTO wallet_topup_orders(tenant_id, order_no, provider, idempotency_key, request_fingerprint, currency, amount_minor, expires_at) VALUES ('$TENANT_B', 'ci-cross-tenant-topup', 'USDT', 'ci-cross-tenant-idempotency', repeat('b', 64), 'USDT', 10000000, NOW() + INTERVAL '1 day'); COMMIT"; then
            echo "Cross-tenant top-up write unexpectedly succeeded"
            exit 1
          fi
          TENANT_C=$(psql -h localhost -U postgres -d tgs -Atqc "INSERT INTO tenants(name) VALUES ('CI auto renewal tenant') RETURNING id")
          USER_C=$(psql -h localhost -U postgres -d tgs -Atqc "INSERT INTO users(auth_subject, email, status, email_verified_at) VALUES ('ci-auto-renew-' || '$TENANT_C', 'ci-auto-renew-' || left('$TENANT_C', 8) || '@example.test', 'ACTIVE', NOW()) RETURNING id")
          PLAN_ID=$(psql -h localhost -U postgres -d tgs -Atqc "SELECT id FROM membership_plans WHERE code = 'BASIC'")
          SUBSCRIPTION_ID=$(psql -h localhost -U postgres -d tgs -Atqc "INSERT INTO tenant_subscriptions(tenant_id, plan_id, status, starts_at, expires_at, billing_source) VALUES ('$TENANT_C', '$PLAN_ID', 'ACTIVE', NOW() - INTERVAL '10 days', NOW() + INTERVAL '2 days', 'WALLET') RETURNING id")
          psql -h localhost -U postgres -d tgs -v ON_ERROR_STOP=1 -c "INSERT INTO tenant_memberships(tenant_id, user_id, role) VALUES ('$TENANT_C', '$USER_C', 'OWNER'); INSERT INTO membership_plan_prices(plan_id, currency, duration_days, amount_minor, version, is_current) VALUES ('$PLAN_ID', 'CNY', 30, 10000, 1, TRUE); INSERT INTO tenant_auto_renew_settings(tenant_id, subscription_id, user_id, enabled, currency, duration_days, timezone, last_price_minor, last_price_version) VALUES ('$TENANT_C', '$SUBSCRIPTION_ID', '$USER_C', TRUE, 'CNY', 30, 'America/Los_Angeles', 10000, 1)"
          CREATED_INTENTS=$(PGPASSWORD="$APP_DB_PASSWORD" psql -h localhost -U tgs_runtime -d tgs -Atqc "SELECT create_due_auto_renew_intents(100)")
          test "$CREATED_INTENTS" = "1"
          CLAIMED_INTENTS=$(PGPASSWORD="$APP_DB_PASSWORD" psql -h localhost -U tgs_runtime -d tgs -Atqc "SELECT COUNT(*) FROM claim_due_auto_renew_intents(50)")
          test "$CLAIMED_INTENTS" = "1"
          psql -h localhost -U postgres -d tgs -v ON_ERROR_STOP=1 -c "UPDATE subscription_renewal_intents SET status = 'CANCELED' WHERE tenant_id = '$TENANT_C'"
          REACTIVATED_INTENTS=$(PGPASSWORD="$APP_DB_PASSWORD" psql -h localhost -U tgs_runtime -d tgs -Atqc "SELECT create_due_auto_renew_intents(100)")
          test "$REACTIVATED_INTENTS" = "1"
          RECLAIMED_INTENTS=$(PGPASSWORD="$APP_DB_PASSWORD" psql -h localhost -U tgs_runtime -d tgs -Atqc "SELECT COUNT(*) FROM claim_due_auto_renew_intents(50)")
          test "$RECLAIMED_INTENTS" = "1"
          REMINDER_RECIPIENTS=$(PGPASSWORD="$APP_DB_PASSWORD" psql -h localhost -U tgs_runtime -d tgs -Atqc "SELECT COUNT(*) FROM list_billing_reminder_recipients(5000) WHERE tenant_id = '$TENANT_C' AND user_id = '$USER_C' AND email IS NOT NULL")
          test "$REMINDER_RECIPIENTS" = "1"
          RENEWAL_VISIBLE=$(PGPASSWORD="$APP_DB_PASSWORD" psql -h localhost -U tgs_runtime -d tgs -Atqc "BEGIN; SELECT set_config('app.tenant_id', '$TENANT_C', true); SELECT COUNT(*) FROM subscription_renewal_intents; COMMIT" | tail -n 1)
          test "$RENEWAL_VISIBLE" = "1"
          PREF_VISIBLE=$(PGPASSWORD="$APP_DB_PASSWORD" psql -h localhost -U tgs_runtime -d tgs -Atqc "BEGIN; SELECT set_config('app.tenant_id', '$TENANT_C', true); INSERT INTO tenant_billing_preferences(tenant_id, timezone) VALUES ('$TENANT_C', 'America/Los_Angeles'); SELECT timezone FROM tenant_billing_preferences; COMMIT" | tail -n 1)
          test "$PREF_VISIBLE" = "America/Los_Angeles"
          if PGPASSWORD="$APP_DB_PASSWORD" psql -h localhost -U tgs_runtime -d tgs -v ON_ERROR_STOP=1 -c "BEGIN; SELECT set_config('app.tenant_id', '$TENANT_C', true); INSERT INTO tenant_billing_preferences(tenant_id, timezone) VALUES ('$TENANT_B', 'UTC'); COMMIT"; then
            echo "Cross-tenant billing preference write unexpectedly succeeded"
            exit 1
          fi
          psql -h localhost -U postgres -d tgs -v ON_ERROR_STOP=1 -c "INSERT INTO billing_email_outbox(tenant_id, user_id, dedupe_key, subject, body) VALUES ('$TENANT_C', '$USER_C', 'ci-email-outbox', 'CI billing email', 'CI billing outbox smoke test')"
          EMAILS_CLAIMED=$(PGPASSWORD="$APP_DB_PASSWORD" psql -h localhost -U tgs_runtime -d tgs -Atqc "SELECT COUNT(*) FROM claim_due_billing_emails(50)")
          test "$EMAILS_CLAIMED" = "1"
          psql -h localhost -U postgres -d tgs -v ON_ERROR_STOP=1 -c "INSERT INTO tenant_telegram_link_tokens(token_hash, tenant_id, user_id, expires_at) VALUES (repeat('c', 64), '$TENANT_C', '$USER_C', NOW() + INTERVAL '15 minutes')"
          TELEGRAM_LINKED=$(PGPASSWORD="$APP_DB_PASSWORD" psql -h localhost -U tgs_runtime -d tgs -Atqc "SELECT consume_telegram_link_token(repeat('c', 64)::char(64), 123456789, 123456789, 'ci_telegram')")
          test "$TELEGRAM_LINKED" = "t"
          USER_D=$(psql -h localhost -U postgres -d tgs -Atqc "INSERT INTO users(auth_subject, email, status, email_verified_at) VALUES ('ci-telegram-collision-' || '$TENANT_C', 'ci-telegram-collision-' || left('$TENANT_C', 8) || '@example.test', 'ACTIVE', NOW()) RETURNING id")
          psql -h localhost -U postgres -d tgs -v ON_ERROR_STOP=1 -c "INSERT INTO tenant_memberships(tenant_id, user_id, role) VALUES ('$TENANT_C', '$USER_D', 'OWNER'); INSERT INTO tenant_telegram_link_tokens(token_hash, tenant_id, user_id, expires_at) VALUES (repeat('d', 64), '$TENANT_C', '$USER_D', NOW() + INTERVAL '15 minutes')"
          TELEGRAM_COLLISION=$(PGPASSWORD="$APP_DB_PASSWORD" psql -h localhost -U tgs_runtime -d tgs -Atqc "SELECT consume_telegram_link_token(repeat('d', 64)::char(64), 123456789, 123456789, 'attacker')")
          test "$TELEGRAM_COLLISION" = "f"
          TELEGRAM_LINK_VISIBLE=$(PGPASSWORD="$APP_DB_PASSWORD" psql -h localhost -U tgs_runtime -d tgs -Atqc "BEGIN; SELECT set_config('app.tenant_id', '$TENANT_C', true); SELECT COUNT(*) FROM tenant_telegram_notification_links; COMMIT" | tail -n 1)
          test "$TELEGRAM_LINK_VISIBLE" = "1"
          psql -h localhost -U postgres -d tgs -v ON_ERROR_STOP=1 -c "INSERT INTO telegram_notification_outbox(tenant_id, user_id, dedupe_key, message_text) VALUES ('$TENANT_C', '$USER_C', 'ci-telegram-outbox', 'CI Telegram outbox smoke test')"
          TELEGRAM_CLAIMED=$(PGPASSWORD="$APP_DB_PASSWORD" psql -h localhost -U tgs_runtime -d tgs -Atqc "SELECT COUNT(*) FROM claim_due_telegram_notifications(50)")
          test "$TELEGRAM_CLAIMED" = "1"
          TELEGRAM_UNLINKED=$(PGPASSWORD="$APP_DB_PASSWORD" psql -h localhost -U tgs_runtime -d tgs -Atqc "SELECT unlink_telegram_user(123456789)")
          test "$TELEGRAM_UNLINKED" = "1"
          TELEGRAM_OUTBOX_STATUS=$(PGPASSWORD="$APP_DB_PASSWORD" psql -h localhost -U tgs_runtime -d tgs -Atqc "BEGIN; SELECT set_config('app.tenant_id', '$TENANT_C', true); SELECT status FROM telegram_notification_outbox WHERE dedupe_key = 'ci-telegram-outbox'; COMMIT" | tail -n 1)
          test "$TELEGRAM_OUTBOX_STATUS" = "FAILED"

