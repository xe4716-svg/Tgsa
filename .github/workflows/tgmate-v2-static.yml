name: TGMate V2 static checks
on:
  pull_request:
    paths: ['workstreams/tgmate-v2/**', '.github/workflows/tgmate-v2-static.yml']
  push:
    branches: ['integration/tgmate-v2-baseline', 'main']
    paths: ['workstreams/tgmate-v2/**', '.github/workflows/tgmate-v2-static.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workstreams/tgmate-v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11.17'
      - run: python -m pip install pglast==8.7
      - run: python -m compileall -q app scripts tests
      - name: Verify imported manifest
        run: |
          python - <<'PYCODE'
          import json,hashlib
          from pathlib import Path
          manifest=json.loads(Path('UPLOAD_MANIFEST.json').read_text())
          assert all(hashlib.sha256(Path(n).read_bytes()).hexdigest()==h for n,h in manifest.items())
          PYCODE
      - run: python validate_sql.py
