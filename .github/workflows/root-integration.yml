name: Root integration checks

on:
  pull_request:
    paths: ['app/**', 'tests/**', 'scripts/**', 'migrations/**', 'requirements.txt', 'requirements.lock', 'Dockerfile', 'docker-compose.yml', 'workstreams/tgmate-v2/**', '.github/workflows/root-integration.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: integration-test-only
          POSTGRES_DB: tgmate_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: integration-test-only
      PGDATABASE: tgmate_ci
      APP_DB_PASSWORD: ephemeral-runtime-test-only
      TGMATE_MIGRATION_INTEGRATION: '1'
      TGMATE_RESOURCE_INTEGRATION: '1'
      TGMATE_IDENTITY_INTEGRATION: '1'
      TGMATE_BUSINESS_READS_INTEGRATION: '1'
      TGMATE_BUSINESS_MIGRATION_INTEGRATION: '1'
      TGMATE_RELAY_CONTROL_INTEGRATION: '1'
      TGMATE_CATALOG_INTEGRATION: '1'
      TGMATE_SCHEMA_ADOPTION_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.17'
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql --version
          dpkg-query -W -f='postgresql-client package=${Version}\n' postgresql-client
      - name: Record Python and PostgreSQL versions
        run: |
          python --version
          psql --version
          psql -h localhost -U postgres -d tgmate_ci -Atqc 'SHOW server_version'
      - name: Root tests and fresh database migration lifecycle
        run: python -m pytest tests -q -rs --junitxml=root-test-results.xml

      - name: Verify notification and login transactions with restricted runtime role
        env:
          TGMATE_NOTIFICATION_INTEGRATION: '1'
          TGMATE_LOGIN_INTEGRATION: '1'
          NOTIFICATION_TEST_DATABASE_URL: postgresql://postgres:integration-test-only@localhost:5432/tgmate_ci
          NOTIFICATION_RUNTIME_DATABASE_URL: postgresql://tgs_runtime:ephemeral-runtime-test-only@localhost:5432/tgmate_ci
        run: python -m pytest tests/test_billing_automation.py tests/test_login_persistence_database.py tests/test_bot_database.py -q --junitxml=notification-login-results.xml

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Record Docker and Compose versions
        run: |
          docker version --format 'Docker client {{.Client.Version}} / server {{.Server.Version}}'
          docker compose version
      - name: Build API and worker image
        run: docker build --tag tgmate-ci .
      - name: Verify API and worker entrypoints exist
        run: docker run --rm tgmate-ci python -c "import app.main; import app.bot_main; import app.workers.billing; import app.workers.mtproto; import app.workers.gateway; import app.workers.bot"
      - name: Record API image Python version
        run: docker run --rm tgmate-ci python --version
      - name: Record API image build ID
        run: docker image inspect tgmate-ci --format 'API image ID={{.Id}}'
      - name: Verify isolated Compose startup and migration replay
        run: python3 scripts/container_smoke.py
      - name: Record pinned Compose image digests
        run: |
          docker image inspect 'postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab' --format 'PostgreSQL={{json .RepoDigests}}'
          docker image inspect 'redis:7.4.12-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f' --format 'Redis={{json .RepoDigests}}'
          docker image inspect 'axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231' --format 'Mailpit={{json .RepoDigests}}'

  preserved-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_PASSWORD: integration-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: integration-test-only
      TGMATE_V2_REGRESSION: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.16'
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql --version
          dpkg-query -W -f='postgresql-client package=${Version}\n' postgresql-client
      - name: Record preserved V2 runtime versions
        run: |
          python --version
          psql --version
          psql -h localhost -U postgres -d postgres -Atqc 'SHOW server_version'
      - name: Run preserved business tests after forward safety migrations
        run: python scripts/verify_v2_regression.py
  dependency-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.17'
      - name: Install pinned dependency resolver
        run: python -m pip install --upgrade pip==26.2.2 pip-tools==7.6.2
      - name: Verify committed root dependency lock
        run: |
          cp requirements.lock /tmp/requirements.lock
          python -m piptools compile --generate-hashes --resolver=backtracking --allow-unsafe --output-file=requirements.lock requirements.txt
          diff -u /tmp/requirements.lock requirements.lock
