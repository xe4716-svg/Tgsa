# Optional overlay. Supply private per-process env files before explicitly using.
services:
  bot:
    build: .
    command: ["uvicorn", "app.bot_main:app", "--host", "0.0.0.0", "--port", "8001"]
    env_file: [.env.bot.runtime]
    restart: "no"
    ports: ["127.0.0.1:${BOT_PORT:-8001}:8001"]
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=5)"]
      interval: 10s
      timeout: 7s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  mtproto:
    build: .
    command: ["python", "-m", "app.workers.gateway", "--from-env"]
    env_file: [.env.mtproto.runtime]
    restart: "no"
    stop_grace_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
