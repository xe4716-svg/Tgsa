<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TGMate 控制台</title>
<style>body{font:16px system-ui;background:#f4f6fa;color:#17243b;margin:0}main{max-width:1050px;margin:40px auto;padding:24px}p{color:#5c6980}.card{background:white;border:1px solid #dce3ee;border-radius:14px;padding:24px;margin:18px 0}label{display:block;margin:14px 0}input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #bdc9db}input{display:block;box-sizing:border-box;width:min(100%,440px);margin-top:6px}button{background:#2058d5;color:white;cursor:pointer;margin:4px}button:disabled{opacity:.5;cursor:wait}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #e4e9f2;font-size:14px;overflow-wrap:anywhere}.scroll{overflow:auto}.tags{display:flex;flex-wrap:wrap;gap:10px}.tags span{padding:8px 12px;background:#eaf0ff;border-radius:20px}[hidden]{display:none!important}#message{min-height:24px}</style></head>
<body><main><h1>TGMate</h1><p>社群运营工作台</p><p id="message" role="status" aria-live="polite"></p>
<section class="card" id="signin"><h2>登录工作区</h2><form id="loginForm"><label>邮箱<input name="email" type="email" autocomplete="username" required maxlength="254"></label><label>工作区标识<input name="workspace" autocomplete="organization" required maxlength="100"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label><button type="submit">登录</button></form><p>请使用管理员分配的账号与工作区标识。</p></section>
<div id="workspace" hidden><section class="card"><h2>当前工作区</h2><p id="identity"></p><button id="refresh">刷新数据</button><button id="logout">退出登录</button><details><summary>修改密码</summary><form id="passwordForm"><label>当前密码<input name="old_password" type="password" autocomplete="current-password" required maxlength="1024"></label><label>新密码<input name="new_password" type="password" autocomplete="new-password" required maxlength="1024"></label><button type="submit">保存并重新登录</button></form></details></section>
<section class="card"><h2>模块进度</h2><div class="tags"><span>群管理 · 本地测试</span><span>双向客服 · 本地测试</span><span>频道群组克隆 · 待实现</span><span>贴纸克隆 · 待实现</span><span>机器人群发 · 本地测试</span></div><p>TG 账号群发为独立通道。真实 Telegram 联调与上线验收尚未完成。</p></section>
<section class="card" id="relayPanel"><h2>客服入口</h2><div class="scroll" id="configs"></div><h2>最近投递</h2><div class="scroll" id="operations"></div></section></div></main>
<script>
'use strict';
const $=s=>document.querySelector(s),message=$('#message');let identity=null;
function csrf(){const part=document.cookie.split('; ').find(x=>x.startsWith('tgmate_csrf='));return part?decodeURIComponent(part.slice(12)):''}
function signedOut(){identity=null;$('#signin').hidden=false;$('#workspace').hidden=true;$('#configs').replaceChildren();$('#operations').replaceChildren();$('#passwordForm').reset()}
async function call(path,options={}){const headers={'Content-Type':'application/json'};if(options.method&&options.method!=='GET')headers['X-CSRF-Token']=csrf();const r=await fetch(path,{...options,credentials:'same-origin',headers,cache:'no-store'});let body={};try{body=await r.json()}catch{}if(!r.ok){if(r.status===401&&path!=='/auth/login')signedOut();throw new Error(typeof body.detail==='string'?body.detail:'操作失败，请稍后重试')}return body}
function can(permission){return identity.permissions.includes('tenant.admin')||identity.permissions.includes(permission)}
function table(target,rows,columns,action){const el=$(target);el.replaceChildren();if(!rows.length){el.textContent='暂无记录';return}const t=document.createElement('table'),head=t.createTHead().insertRow();for(const [,label]of columns){const th=document.createElement('th');th.textContent=label;head.append(th)}if(action){const th=document.createElement('th');th.textContent='操作';head.append(th)}for(const row of rows){const tr=t.insertRow();for(const [key]of columns)tr.insertCell().textContent=row[key]??'—';if(action){const b=document.createElement('button');b.textContent=row.status==='active'?'暂停':'启用';b.onclick=()=>busy(b,()=>action(row));tr.insertCell().append(b)}}el.append(t)}
async function refresh(){if(!identity)return;$('#relayPanel').hidden=!can('relay.read');if(!can('relay.read'))return;const [configs,operations]=await Promise.all([call('/api/relay/configs'),call('/api/relay/operations')]);table('#configs',configs,[['id','入口'],['status','状态']],can('relay.manage')?async row=>{await call('/api/relay/configs/'+encodeURIComponent(row.id)+'/state',{method:'POST',body:JSON.stringify({status:row.status==='active'?'paused':'active'})});await refresh()}:null);table('#operations',operations,[['id','消息'],['direction','方向'],['status','状态']])}
async function enter(who){identity=who;$('#signin').hidden=true;$('#workspace').hidden=false;$('#identity').textContent='工作区 '+who.tenant_id+' · '+(who.email||who.user_id)+' · '+who.role;await refresh()}
async function busy(button,task){button.disabled=true;message.textContent='正在处理…';try{await task();message.textContent='操作完成'}catch(e){message.textContent=e.message}finally{button.disabled=false}}
$('#loginForm').onsubmit=e=>{e.preventDefault();const form=e.currentTarget,data=Object.fromEntries(new FormData(form));busy(form.querySelector('button'),async()=>{try{await call('/auth/login',{method:'POST',body:JSON.stringify(data)});await enter(await call('/auth/me'))}finally{form.elements.password.value='';data.password=''}})};
$('#logout').onclick=()=>busy($('#logout'),async()=>{await call('/auth/logout',{method:'POST'});signedOut()});
$('#refresh').onclick=()=>busy($('#refresh'),async()=>{await enter(await call('/auth/me'))});
$('#passwordForm').onsubmit=e=>{e.preventDefault();const form=e.currentTarget,data=Object.fromEntries(new FormData(form));busy(form.querySelector('button'),async()=>{try{await call('/auth/password',{method:'POST',body:JSON.stringify(data)});signedOut()}finally{form.reset();data.old_password='';data.new_password=''}})};
(async()=>{try{await enter(await call('/auth/me'))}catch(e){signedOut();message.textContent=e.message}})();
</script></body></html>
